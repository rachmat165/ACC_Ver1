# Konfigurasi Arunika Command Centre
company:
  name: "PT. Arunika Teknologi Global"
  director: "Adang A. Kunandar"
  email: "corsec@arunika2045.com"
  website: "arunika2045.com"

provider:
  # Pilih provider aktif:
  #   anthropic  -> Claude via Anthropic API (paling disarankan)
  #   openai     -> GPT via OpenAI API
  #   openrouter -> 100+ model via OpenRouter (1 key untuk semua)
  #   lmstudio   -> Model lokal di komputer (gratis, butuh LM Studio)
  active: anthropic
  temperature: 0.4
  max_tokens: 4096

  # OpenRouter - model yang digunakan (bisa dioverride via env OPENROUTER_MODEL)
  openrouter_model: anthropic/claude-sonnet-4-5

  # LM Studio - konfigurasi server lokal
  lmstudio_base_url: http://localhost:1234/v1
  lmstudio_model: local-model

# Perutean tugas -> tingkat model (hemat biaya)
routing:
  riset: primary
  presentasi: primary
  proposal: primary
  surat_penawaran: fallback
  laporan_kerja: fallback
  laporan_keuangan: primary   # tugas presisi -> model terkuat
  balasan_cepat: fallback

agent:
  heartbeat_minutes: 30
  language: id
  require_human_approval: true   # skill baru & dokumen resmi minta persetujuan

# WhatsApp Webhook
whatsapp:
  # Maksimal riwayat pesan per sesi (jumlah pasang user+assistant)
  max_session_history: 10
  # Panjang maksimal reply sebelum dipotong (karakter)
  max_reply_length: 3800

multitenant:
  default_tenant: contoh-tenant
